name: One-time cleanup of merged branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'velleityy/Valorant-Team-Rank-Calculator'
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "copy/prove-eligibility-hero"
            "copy/refresh-acts-footer-2025"
            "copy/remove-duplicate-cap"
            "design/refresh-team-calculator"
            "design/use-official-valorant-uw-branding"
            "ui/link-author-linkedin-footer"
          )
          for branch in "${branches[@]}"; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Already absent: ${branch}"
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted: ${branch}"
          done
